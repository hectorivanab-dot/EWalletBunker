services:
  app:
    build: .
    container_name: ewallet-bunker

    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/app
      - /app/node_modules

    environment:
      - NODE_ENV=development
      - NGROK_AUTHTOKEN=3E2sCD6zUCcmwV9rkB5LOMNXfYf_7M9QgpqqdAFDE4XJ8PC7R
      - REACT_NATIVE_PACKAGER_HOSTNAME=192.168.137.1
    stdin_open: true
    tty: true
